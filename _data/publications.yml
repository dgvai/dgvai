# Publications page and home page "Selected publications".
#
# `intro` is the line under the page title (Markdown).
# Each paper under `papers` takes:
#   key       unique id, used for the #anchor link (e.g. smith2024title)
#   title     paper title
#   authors   list of names; names in profile.yml `highlight_names` are bolded
#   venue     full conference or journal name
#   abbr      short badge text (e.g. CVPR); falls back to `type`
#   year      publication year; the page groups papers by year automatically
#   type      Conference, Journal, Preprint, ...
# Optional:
#   selected: true   also show it on the home page
#   url, pdf, doi, code, note, bibtex
# List papers newest first within a year.

